<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Extravaganza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — wordmark bar, tab strip, one working panel; tables scroll inside their own frames */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece6; --ink:#16211b; --muted:#5d6b62; --line:#d3dbd4;
  --turf:#1f5c3a; --turf-ink:#ffffff; --post:#e2a800; --post-soft:#fbf0cc;
  --win:#1d7a45; --win-bg:#dcf1e3; --loss:#b3362b; --loss-bg:#f8e0dc; --push:#6b6f73; --push-bg:#e7e8ea;
  --f-display:"Graduate","Rockwell","Georgia",serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201b; --sunk:#1d2923; --ink:#e7eee9; --muted:#97a69c; --line:#2b3a32;
  --turf:#2f7d52; --turf-ink:#ffffff; --post:#f0bd2a; --post-soft:#3a3115;
  --win:#5fcf8b; --win-bg:#173a26; --loss:#f08a7e; --loss-bg:#40201c; --push:#a9adb1; --push-bg:#2a2e31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201b; --sunk:#1d2923; --ink:#e7eee9; --muted:#97a69c; --line:#2b3a32;
  --turf:#2f7d52; --turf-ink:#ffffff; --post:#f0bd2a; --post-soft:#3a3115;
  --win:#5fcf8b; --win-bg:#173a26; --loss:#f08a7e; --loss-bg:#40201c; --push:#a9adb1; --push-bg:#2a2e31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--turf);color:var(--turf-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.mark{font-family:var(--f-display);font-size:1.55rem;letter-spacing:.02em;line-height:1;margin:0}
.mark small{display:block;font-family:var(--f-data);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:4px}
.as{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem}
.as select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);color:#fff;max-width:220px}
.as select option{color:#000}
.demo{background:var(--post-soft);border-bottom:1px solid var(--line);font-size:.85rem}
.demo .wrap{padding-block:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--turf)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font:600 .95rem var(--f-body);background:none;border:0;color:var(--muted);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--post)}
main .wrap{padding-block:20px 60px;display:grid;gap:18px}
h2{font-family:var(--f-data);font-weight:700;font-size:1.6rem;letter-spacing:.01em;margin:0;text-wrap:balance}
h3{font-family:var(--f-data);font-weight:700;font-size:1.15rem;margin:0;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.btn{font:600 .9rem var(--f-body);padding:9px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--post);outline-offset:2px}
select.f,input.f{font:inherit;padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .78rem var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.open{background:var(--win-bg);color:var(--win)}.chip.locked{background:var(--loss-bg);color:var(--loss)}.chip.final{background:var(--push-bg);color:var(--push)}
.chip.gold{background:var(--post-soft);color:var(--ink)}
.chip.live{background:var(--loss);color:#fff}
.cell.lv{outline:1.5px dashed currentColor;outline-offset:-2px}
.livebar{border-color:var(--loss)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
/* picks */
.games{display:grid;gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px}
.game.both{border-color:var(--post)}
.ghead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.ghead .n{font:700 .8rem var(--f-data);color:var(--muted);letter-spacing:.08em}
.ghead .t{font-weight:700;font-size:1.02rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{font:600 .92rem var(--f-body);text-align:left;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center;min-width:0}
.opt .ln{font-family:var(--f-data);font-size:1rem;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.opt[aria-pressed="true"] .ln{color:var(--turf-ink);opacity:.85}
.opt.W{box-shadow:inset 0 0 0 2px var(--win)}.opt.L{box-shadow:inset 0 0 0 2px var(--loss)}
.stars{display:flex;gap:4px;margin-top:6px}
.star{font:700 .78rem var(--f-data);padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.star[aria-pressed="true"]{background:var(--post);border-color:var(--post);color:#1b1500}
.slip{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;box-shadow:0 -4px 18px rgba(0,0,0,.08);margin-bottom:env(safe-area-inset-bottom,0px)}
.req{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.req span.ok{color:var(--win)}.req span.no{color:var(--loss)}
/* score ticker */
.ticker{background:var(--sunk);border-bottom:1px solid var(--line)}
.tk{display:flex;gap:6px;overflow-x:auto;padding-block:6px;align-items:stretch;scrollbar-width:thin}
.tkw{font:700 .74rem var(--f-data);letter-spacing:.1em;color:var(--muted);align-self:center;white-space:nowrap;padding-right:4px}
.tkg{flex:0 0 auto;display:grid;grid-template-columns:auto;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;min-width:86px}
.tkt{display:flex;justify-content:space-between;gap:10px;font:600 .86rem var(--f-data);color:var(--muted)}
.tkt b{font-weight:700;letter-spacing:.03em}
.tkt.win{color:var(--ink)}
.tkst{font:600 .7rem var(--f-data);letter-spacing:.06em;color:var(--muted)}
.tklive{font:700 .7rem var(--f-data);letter-spacing:.06em;color:var(--loss)}
/* scoreboard */
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.sbcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.sbcard.both{border-color:var(--post)}
.sbtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sbtop .n{font:700 .76rem var(--f-data);color:var(--muted);letter-spacing:.08em}
.sbrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;color:var(--muted)}
.sbrow.lead{color:var(--ink)}
.sbrow .ab{font:700 1.05rem var(--f-data);letter-spacing:.03em}
.sbrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbrow .pts{font:700 1.5rem var(--f-data);line-height:1.1}
.sbline{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.sbres{font-size:.85rem}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 .76rem var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
tr.cut td{border-bottom:2px dashed var(--post)}
.pc{font-weight:700}
.cell{display:inline-block;min-width:44px;text-align:center;font:600 .82rem var(--f-data);padding:2px 5px;border-radius:5px}
.cell.W{background:var(--win-bg);color:var(--win)}.cell.L{background:var(--loss-bg);color:var(--loss)}.cell.T{background:var(--push-bg);color:var(--push)}.cell.P{background:var(--sunk);color:var(--muted)}
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.flights .panel{padding:0;overflow:hidden}
.flights h3{padding:12px 14px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:700 1.6rem var(--f-data)}
.kpi span{color:var(--muted);font-size:.85rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
.admin-games input.f{width:74px}.admin-games input.f.w{width:130px}
label.ck{display:inline-flex;gap:6px;align-items:center}
@media (max-width:620px){
  header.top .wrap{padding-block:10px;gap:8px}
  .mark{font-size:1.25rem}.mark small{font-size:.68rem;margin-top:2px}
  .as{margin-left:0;width:100%}.as select{flex:1;max-width:none}
  .demo{font-size:.78rem}.demo .wrap{padding-block:5px;flex-wrap:nowrap}.demo .btn{padding:5px 9px;font-size:.78rem;white-space:nowrap}
  .demotx{min-width:0}
  nav.tabs button{padding:10px 11px;font-size:.9rem}
  main .wrap{padding-block:14px 40px;gap:14px}
  h2{font-size:1.35rem}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{padding:9px 10px}.kpi b{font-size:1.1rem;overflow-wrap:anywhere}.kpi span{font-size:.75rem}
  .slip{padding:9px 12px;gap:8px}.req{gap:10px;font-size:.85rem}.slip .btn{padding:8px 12px}
  .hide-sm{display:none}
  .slip{flex-wrap:nowrap}.req{gap:8px;font-size:.8rem}
  td:nth-child(2){white-space:normal}
  th,td{padding:7px 8px}
  .game{padding:10px 12px}
}
@media (prefers-reduced-motion:no-preference){.opt,.star{transition:background .12s,border-color .12s}}
</style>
</head>

      (cur?'<div class="stars">'+[1,2,3].map(s=>'<button class="star" type="button" aria-pressed="'+(cur.s===s)+'" data-g="'+(i+1)+'" data-t="'+t+'" data-s="'+s+'"'+(isLocked?" disabled":"")+'>'+(s===1?"1 pt":s+"★")+'</button>').join("")+(isLocked&&hasScore(G)?' <span class="cell '+grade(G,cur)+(isLive(G)?' lv':'')+'">'+(isLive(G)?({W:"Winning",L:"Losing",T:"Push",P:"—"}):({W:"Win",L:"Loss",T:"Push",P:"—"}))[grade(G,cur)]+'</span>':"")+'</div>':"")+'</div>';};
  const rec=weekRec(W,who);
  v.innerHTML='<div class="row"><div><h2>Week '+wk+' picks</h2><p class="sub">'+esc(who)+' · '+statusChip(W)+(W.sample?' <span class="chip gold">Sample lines</span>':'')+(W.week===12?' <span class="chip gold">Separation Week · double points</span>':'')+'</p></div><span class="spacer"></span>'+
    '<select class="f" id="pw" aria-label="Week">'+weeksList().map(x=>'<option value="'+x.week+'"'+(x.week===wk?" selected":"")+'>Week '+x.week+'</option>').join("")+'</select></div>'+
    (isLocked&&W.picks[who]?'<div class="kpis"><div class="kpi"><b class="num">'+rec.W+'–'+rec.L+'–'+rec.T+'</b><span>Week '+wk+' record (stars counted)</span></div><div class="kpi"><b class="num">'+fmtPct(pct(rec))+'</b><span>Win percentage</span></div></div>':'')+
    (!isLocked?'<p class="sub">Pick one side or the total in each game. Gold-bordered games need both. Mark two picks 2★ and one pick 3★.</p>':'')+
    (isLocked&&!W.picks[who]?'<div class="panel empty">No picks were submitted for this week.</div>':
    '<div class="games">'+W.games.map((G,i)=>'<div class="game'+(G.both?" both":"")+'"><div class="ghead"><span class="n">GAME '+(i+1)+'</span><span class="t">'+teamLine(G)+'</span>'+(G.both?'<span class="chip gold">Pick both</span>':'')+(hasScore(G)?(isLive(G)?'<span class="chip live">Live '+esc(G.clock||"")+'</span>':'')+'<span class="sub num">'+(isLive(G)?'':'Final: ')+esc(G.fav)+' '+G.favScore+', '+esc(G.dog)+' '+G.dogScore+'</span>':'')+'</div><div class="opts">'+opts(G,i,"ats")+opts(G,i,"ou")+'</div></div>').join("")+'</div>')+
    (!isLocked?'<div class="slip"><div class="req"><span class="'+(complete?"ok":"no")+'">'+(complete?"✓":"○")+' All games</span><span class="'+(s2===2?"ok":"no")+'">'+(s2===2?"✓":"○")+' 2★ '+s2+'/2</span><span class="'+(s3===1?"ok":"no")+'">'+(s3===1?"✓":"○")+' 3★ '+s3+'/1</span></div><span class="spacer"></span><button class="btn primary" id="submit" type="button"'+(valid?"":" disabled")+'>'+(W.picks[who]?"Update picks":"Submit picks")+'</button></div>':'');
  $("#pw").onchange=e=>{selWeek=+e.target.value;vPicks();};
  if(isLocked) return;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const g=+b.dataset.g,t=b.dataset.t,p=b.dataset.p;const G=W.games[g-1];
    const ex=find(g,t);
    if(ex&&ex.p===p){draft=draft.filter(x=>x!==ex);}
    else if(ex){ex.p=p;}
    else{ if(!G.both){const other=find(g,t==="ats"?"ou":"ats"); if(other) draft=draft.filter(x=>x!==other);} draft.push({g,t,p,s:1}); }
    vPicks();});
  v.querySelectorAll(".star").forEach(b=>b.onclick=()=>{const ex=find(+b.dataset.g,b.dataset.t);const s=+b.dataset.s;
    if(s===3) draft.forEach(x=>{if(x.s===3)x.s=1;});
    if(s===2&&ex.s!==2&&draft.filter(x=>x.s===2).length>=2){toast("You already have two 2★ picks. Remove one first.");return;}
    ex.s=s; vPicks();});
  const sb=$("#submit"); if(sb) sb.onclick=()=>{if(locked(W)){toast("Picks are locked for this week");return;}W.picks[who]=draft.map(x=>({...x})).sort((a,b)=>a.g-b.g||(a.t<b.t?-1:1));save();toast("Picks saved for Week "+wk);vPicks();};
}

function liveBar(){const n=liveCount();if(!n)return "";return '<div class="panel livebar row"><span class="chip live">Live</span><span>'+n+' game'+(n>1?"s are":" is")+' in progress. '+(LIVE?'Standings include current scores and will move as games go on.':'Standings show final games only.')+'</span><span class="spacer"></span><label class="ck"><input type="checkbox" id="livet"'+(LIVE?" checked":"")+'> Include games in progress</label></div>';}
function wireLive(fn){const c=$("#livet");if(c)c.onchange=()=>{LIVE=c.checked;fn();};}

/* ---------- Scores ---------- */
let scoreWeek=null;
function vScores(){
  const v=$("#view"); const wk=scoreWeek&&S.weeks[scoreWeek]?scoreWeek:gameWeek(); const W=S.weeks[wk];
  const card=(G,i)=>{const awayFav=G.home!=="fav";const away={n:awayFav?G.fav:G.dog,s:awayFav?G.favScore:G.dogScore},home={n:awayFav?G.dog:G.fav,s:awayFav?G.dogScore:G.favScore};
    const sc=hasScore(G);const lead=sc?(+away.s>+home.s?"a":+home.s>+away.s?"h":""):"";
    let ats="",ou="";
    if(sc){const d=+G.favScore + +G.spread - +G.dogScore;ats=d===0?"Push on the spread":(d>0?abbr(G.fav):abbr(G.dog))+(isLive(G)?" covering ":" covered ")+abbr(G.fav)+" "+sp(G.spread);
      const t=+G.favScore + +G.dogScore;ou=t===+G.ou?"Push on "+G.ou:(t>+G.ou?"Over":"Under")+" "+G.ou+" · "+t+" pts";}
    const status=isLive(G)?'<span class="chip live">Live '+esc(G.clock||"")+'</span>':sc?'<span class="chip final">Final</span>':'<span class="chip">Not started</span>';

    return '<div class="sbcard'+(G.both?" both":"")+'"><div class="sbtop"><span class="n">GAME '+(i+1)+'</span>'+status+'</div>'+row(away,"a")+row(home,"h")+

  v.innerHTML='<div class="row"><div><h2>'+(wk===12?"Separation Week 12":"Week "+wk)+' scoreboard</h2><p class="sub">Scores against the pool\'s lines. In the live app these fill in from ESPN as games are played.</p></div><span class="spacer"></span><select class="f" id="scw" aria-label="Week">'+weeksList().map(x=>'<option value="'+x.week+'"'+(x.week===wk?" selected":"")+'>Week '+x.week+'</option>').join("")+'</select></div>'+
    (W.games.length?'<div class="sbgrid">'+W.games.map(card).join("")+'</div>':'<div class="panel empty">No games entered for this week yet.</div>');
  $("#scw").onchange=e=>{scoreWeek=+e.target.value;vScores();};

/* ---------- Money ---------- */
function vMoney(){
  const v=$("#view"); const fee=+S.settings.entryFee||0; const payers=S.entries.filter(e=>!e.free); const paid=payers.filter(e=>e.paid).length;
  const winners=weeksList().filter(weekDone).map(W=>({W,top:weekly(W).filter(r=>r.rank===1)}));
  const isA=who===ADMIN;
  v.innerHTML='<div><h2>Money</h2><p class="sub">Tracking only. Entry fees and prizes still change hands outside the app.</p></div>'+
  '<div class="kpis"><div class="kpi"><b class="num">$'+(fee*payers.length).toLocaleString()+'</b><span>Pot: '+payers.length+' paying entries at $'+fee+(S.entries.length>payers.length?' · '+(S.entries.length-payers.length)+' free':'')+'</span></div><div class="kpi"><b class="num">'+paid+' / '+payers.length+'</b><span>Paying entries paid</span></div><div class="kpi"><b class="num">$'+(winners.length*(+S.settings.weeklyPrize||0)).toLocaleString()+'</b><span>Weekly prizes so far ($'+S.settings.weeklyPrize+' a week)</span></div></div>'+
  '<div class="panel"><h3>Weekly winners</h3><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Week</th><th>Winner</th><th class="r">Pct</th><th class="r">Prize each</th></tr></thead><tbody>'+
  (winners.length?winners.map(({W,top})=>'<tr><td>Week '+W.week+'</td><td>'+top.map(t=>esc(t.name)).join(" & ")+'</td><td class="r num">'+fmtPct(top[0].pct)+'</td><td class="r num">$'+((+S.settings.weeklyPrize||0)/top.length).toLocaleString('en-US',{maximumFractionDigits:2,minimumFractionDigits:((+S.settings.weeklyPrize||0)%top.length)?2:0})+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">No weeks are final yet.</td></tr>')+'</tbody></table></div><p class="sub">There is no tiebreaker. Entries that tie for the best week split the prize evenly.</p></div>'+
  (()=>{const pot=fee*payers.length,wk=18*(+S.settings.weeklyPrize||0),ov=+S.settings.overallPrize||0,sp2=+S.settings.secondPrize||0,fp=+S.settings.flightPrize||0,rp=+S.settings.runnerUpPrize||0,all=season();
   const line=(label,p)=>'<tr><td>'+label+(p.names.length>1?' <span class="chip">Tie · split</span>':'')+'</td><td>'+p.names.map(esc).join(" & ")+' · '+fmtPct(p.pct)+'</td><td class="r num">'+money(p.each)+(p.names.length>1?' each':'')+'</td></tr>';
   const place=n=>n===1?"Winner":"Runner-up";
   const ovRows=payouts(all,[ov,sp2]).map(p=>line(p.place===1?"Overall winner":"Second place overall",p)).join("");
   const flRows=FLIGHTS.map(f=>payouts(all.filter(r=>r.flight===f),[fp,rp]).map(p=>line(f+" flight "+place(p.place).toLowerCase(),p)).join("")).join("");
   return '<div class="panel"><h3>Season prizes · if the season ended today</h3><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Prize</th><th>Currently in line</th><th class="r">Amount</th></tr></thead><tbody>'+
   '<tr><td>Weekly winners (18 weeks × '+money(+S.settings.weeklyPrize||0)+')</td><td>See above</td><td class="r num">'+money(wk)+'</td></tr>'+ovRows+flRows+
   '<tr><td>Not yet assigned</td><td>—</td><td class="r num">'+money(pot-wk-ov-sp2-(fp+rp)*FLIGHTS.length)+'</td></tr>'+
   '<tr><td><b>Total pot</b></td><td></td><td class="r num"><b>'+money(pot)+'</b></td></tr></tbody></table></div><p class="sub">There is no tiebreaker. Entries tied at a prize spot split the money for the places they cover, so two entries tied for first share first and second.</p></div>';})()+
  (isA?'<div class="panel"><h3>Entry fees</h3><p class="sub">Mark each entry paid. The organizer\'s entry plays free and is left out of the pot.</p><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Entry</th><th>Flight</th><th>Paid</th><th>Organizer (free)</th></tr></thead><tbody>'+S.entries.map((e,i)=>'<tr><td>'+esc(e.name)+'</td><td>'+e.flight+'</td><td>'+(e.free?'<span class="chip">No fee</span>':'<label class="ck"><input type="checkbox" data-i="'+i+'"'+(e.paid?" checked":"")+'> '+(e.paid?"Paid":"Owes $"+fee)+'</label>')+'</td><td><input type="checkbox" aria-label="Organizer entry" data-free="'+i+'"'+(e.free?" checked":"")+'></td></tr>').join("")+'</tbody></table></div></div>':'');
  v.querySelectorAll("input[type=checkbox][data-i]").forEach(c=>c.onchange=()=>{S.entries[+c.dataset.i].paid=c.checked;save();vMoney();});
  v.querySelectorAll("input[data-free]").forEach(c=>c.onchange=()=>{const e=S.entries[+c.dataset.free];if(c.checked)S.entries.forEach(x=>x.free=false);e.free=c.checked;save();vMoney();toast(c.checked?e.name+" marked as the organizer's free entry":"Free entry removed");});
}

  '<p class="sub">Enter the spread as a negative number for the favorite. Entering both scores grades every pick for that game. Tick In progress while a game is still being played. In the live app, scores and game clocks fill in from ESPN automatically.</p>'+
  '<div class="tbl admin-games" style="margin-top:10px"><table><thead><tr><th>#</th><th>Favorite</th><th class="r">Spread</th><th>Underdog</th><th>Home</th><th class="r">O/U</th><th>Pick both</th><th class="r">Fav score</th><th class="r">Dog score</th><th>In progress</th><th></th></tr></thead><tbody>'+
  W.games.map((G,i)=>'<tr data-i="'+i+'"><td class="num">'+(i+1)+'</td><td><input class="f w" id="fav'+i+'" data-k="fav" value="'+esc(G.fav)+'"></td><td><input class="f" id="spr'+i+'" data-k="spread" type="number" step="0.5" value="'+G.spread+'"></td><td><input class="f w" id="dog'+i+'" data-k="dog" value="'+esc(G.dog)+'"></td><td><select class="f" id="home'+i+'" data-k="home"><option value="fav"'+(G.home==="fav"?" selected":"")+'>Favorite</option><option value="dog"'+(G.home==="dog"?" selected":"")+'>Underdog</option></select></td><td><input class="f" id="ou'+i+'" data-k="ou" type="number" step="0.5" value="'+G.ou+'"></td><td><input type="checkbox" id="both'+i+'" data-k="both"'+(G.both?" checked":"")+' aria-label="Pick both"></td><td><input class="f" id="fs'+i+'" data-k="favScore" type="number" value="'+(G.favScore??"")+'"></td><td><input class="f" id="ds'+i+'" data-k="dogScore" type="number" value="'+(G.dogScore??"")+'"></td><td><label class="ck"><input type="checkbox" id="lv'+i+'" data-k="live"'+(G.live?" checked":"")+' aria-label="Game in progress"><input class="f" id="ck'+i+'" data-k="clock" placeholder="Q3 4:12" value="'+esc(G.clock||"")+'" style="width:82px"></label></td><td><button class="btn" type="button" data-del="'+i+'"'+(locked(W)?" disabled":"")+'>Remove</button></td></tr>').join("")+
  '</tbody></table></div></div>'+
  (W.sample?'<div class="panel row"><div><h3>Demo: see a live Sunday</h3><p class="sub">Locks Week 9, fills in random sample picks for every entry, and sets some games final and some in progress so you can watch live standings. Reset demo undoes it.</p></div><span class="spacer"></span><button class="btn primary" id="sim" type="button">Simulate Sunday afternoon</button></div>':'')+
  '<div class="panel"><h3>Pool settings</h3><div class="row" style="margin-top:8px"><label for="fee">Entry fee $</label><input class="f" id="fee" type="number" value="'+S.settings.entryFee+'" style="width:100px"><label for="wp">Weekly prize $</label><input class="f" id="wp" type="number" value="'+S.settings.weeklyPrize+'" style="width:100px"><label for="op">Overall winner $</label><input class="f" id="op" type="number" value="'+(S.settings.overallPrize||0)+'" style="width:100px"><label for="sp2">2nd overall $</label><input class="f" id="sp2" type="number" value="'+(S.settings.secondPrize||0)+'" style="width:100px"><label for="fp">Flight winner $</label><input class="f" id="fp" type="number" value="'+(S.settings.flightPrize||0)+'" style="width:100px"><label for="rp">Flight runner-up $</label><input class="f" id="rp" type="number" value="'+(S.settings.runnerUpPrize||0)+'" style="width:100px"><button class="btn" id="saves" type="button">Save settings</button></div></div>'+
  '<div class="panel"><div class="row"><h3>Entries & flights</h3><span class="spacer"></span><input class="f" id="newe" placeholder="New entry name" aria-label="New entry name"><button class="btn" id="adde" type="button">Add entry</button></div><p class="sub">Reshuffle flights here at the start of each season.</p><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Entry</th><th>Flight</th></tr></thead><tbody>'+
  S.entries.map((e,i)=>'<tr><td>'+esc(e.name)+(e.free?' <span class="chip">Organizer</span>':'')+'</td><td><select class="f" id="fl'+i+'" data-fl="'+i+'">'+FLIGHTS.concat("Independent").map(f=>'<option'+(e.flight===f?" selected":"")+'>'+f+'</option>').join("")+'</select></td></tr>').join("")+'</tbody></table></div></div>'+
  '<div class="panel"><h3>Who has submitted for Week '+wk+'</h3><p class="sub">'+S.entries.filter(e=>!W.picks[e.name]).map(e=>esc(e.name)).join(", ")+(subs===S.entries.length?"Everyone is in.":" still need to pick.")+'</p></div>';
  $("#aw").onchange=e=>{adminWeek=+e.target.value;vAdmin();};
  $("#addw").onclick=()=>{const n=Math.max(...Object.keys(S.weeks).map(Number))+1;S.weeks[n]={week:n,lockAt:weekLock(n),games:[],picks:{}};adminWeek=n;save();vAdmin();toast("Week "+n+" added. Add its games next.");};
  $("#setlock").onclick=()=>{const val=$("#lock").value;W.lockAt=val?new Date(val).toISOString():null;save();vAdmin();toast("Lock time saved");};
  const readGames=()=>{v.querySelectorAll("tbody tr[data-i]").forEach(tr=>{const G=W.games[+tr.dataset.i];tr.querySelectorAll("[data-k]").forEach(inp=>{const k=inp.dataset.k;let val=inp.type==="checkbox"?(inp.checked?1:0):inp.value;
    if(["spread","ou"].includes(k))val=+val; if(["favScore","dogScore"].includes(k))val=val===""?null:+val; G[k]=val;});});};
  $("#addg").onclick=()=>{readGames();W.games.push({fav:"",spread:-3,dog:"",home:"fav",ou:44.5,both:0,favScore:null,dogScore:null});vAdmin();};
  $("#saveg").onclick=()=>{readGames();save();vAdmin();toast("Games and scores saved. Standings updated.");};
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{readGames();const i=+b.dataset.del;W.games.splice(i,1);Object.values(W.picks).forEach(l=>{for(let j=l.length-1;j>=0;j--){if(l[j].g===i+1)l.splice(j,1);else if(l[j].g>i+1)l[j].g--;}});save();vAdmin();});
  v.querySelectorAll("[data-fl]").forEach(s=>s.onchange=()=>{S.entries[+s.dataset.fl].flight=s.value;save();toast("Flight updated");});
  $("#adde").onclick=()=>{const n=$("#newe").value.trim();if(!n){toast("Type the entry name first");return;}if(S.entries.some(e=>e.name.toLowerCase()===n.toLowerCase())){toast("That entry already exists");return;}S.entries.push({name:n,flight:"Independent",paid:false,free:false});S.entries.sort((a,b)=>a.name.localeCompare(b.name));save();vAdmin();toast(n+" added");};
  const simb=$("#sim"); if(simb) simb.onclick=()=>{
    const rnd=n=>Math.floor(Math.random()*n);
    W.lockAt=new Date(Date.now()-3*3600e3).toISOString();
    S.entries.forEach(e=>{const list=[];W.games.forEach((G,i)=>{const ats={g:i+1,t:"ats",p:rnd(2)?"fav":"dog",s:1},ou={g:i+1,t:"ou",p:rnd(2)?"over":"under",s:1};if(G.both)list.push(ats,ou);else list.push(rnd(2)?ats:ou);});
      const idx=[...list.keys()].sort(()=>Math.random()-.5);list[idx[0]].s=2;list[idx[1]].s=2;list[idx[2]].s=3;W.picks[e.name]=list;});
    const clocks=["Q2 2:41","Q3 11:05","Q3 4:12","Q4 8:30"];
    W.games.forEach((G,i)=>{if(i<8){const t=Math.round(G.ou+rnd(21)-10),f=Math.round(t/2+(rnd(15)-4));G.favScore=Math.max(0,f);G.dogScore=Math.max(0,t-G.favScore);G.live=0;G.clock="";}
      else if(i<11){G.favScore=rnd(24);G.dogScore=rnd(24);G.live=1;G.clock=clocks[rnd(4)];}else{G.favScore=null;G.dogScore=null;G.live=0;G.clock="";}});
    save();tab="standings";render();toast("Week 9 is underway. Standings now include live games.");};
  $("#saves").onclick=()=>{S.settings.entryFee=+$("#fee").value;S.settings.weeklyPrize=+$("#wp").value;S.settings.overallPrize=+$("#op").value;S.settings.flightPrize=+$("#fp").value;S.settings.secondPrize=+$("#sp2").value;S.settings.runnerUpPrize=+$("#rp").value;save();toast("Settings saved");};
}
render();
</script>

</body>
</html>
